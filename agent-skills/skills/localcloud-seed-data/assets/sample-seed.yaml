services:
  gcs:
    buckets:
      - name: local-test-bucket
        objects:
          - key: fixtures/hello.txt
            content: Hello from LocalCloud

  pubsub:
    topics:
      - name: user-events
        subscriptions:
          - name: user-events-sub

  bigquery:
    datasets:
      - name: analytics
        location: US
    tables:
      - dataset: analytics
        name: events
        schema:
          fields:
            - name: event_id
              type: STRING
              mode: REQUIRED
            - name: amount
              type: INTEGER
        rows:
          - event_id: event-001
            amount: 10

  secretmanager:
    secrets:
      - name: api-key
        versions:
          - data: sk-local-test-key-12345
