name: LocalCloud Integration Evaluation

on:
  workflow_dispatch:

# LICENSE GATE: the reviewed LocalCloud license excludes organization/team CI.
# Use this technical template only after the rights holder grants the intended use.
# Replace the placeholder with an exact qualified image digest.
jobs:
  localcloud-integration:
    runs-on: ubuntu-latest
    services:
      localcloud:
        image: jaysen2apache/localcloud@sha256:REPLACE_WITH_QUALIFIED_DIGEST
        ports:
          - 24080:24080
          # Add only canonical service ports required by this test.
        options: >-
          --memory 4g
          --health-cmd "curl -f http://localhost:24080/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for LocalCloud
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:24080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs localcloud || true
          exit 1

      - name: Export LocalCloud environment
        run: |
          curl -fsS http://localhost:24080/env?format=shell \
            | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Run narrow LocalCloud integration tests
        run: |
          # Replace with this repository's reviewed local-only test command.
          npm run test:integration -- --localcloud
