name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history: sitemap lastmod and docs dateModified come from commit dates.
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.9.1
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm run test:dependencies
      - name: Report advisories in all dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=low
      - name: Build and verify site
        run: pnpm run build:cloudflare
      - name: Test installer
        run: pnpm run test:installer
      - name: Test analytics proxy and page loading
        run: pnpm run test:analytics && pnpm run test:performance
      - name: Test the Worker and built assets in workerd
        run: pnpm run test:worker
      - name: Test live SEO verification
        run: pnpm run test:live-seo
      - name: Test the sitemap guard
        run: pnpm run test:sitemap-guard
      - name: Test the previous-bundle carry-over
        run: pnpm run test:asset-manifest
      # Blocking: every URL in the live sitemap must still be built or be a _redirects
      # source. An unreachable live sitemap is a warning only.
      - name: Check that no live sitemap URL disappears
        run: node scripts/sitemap-guard.mjs check --live-url https://local.cloud/sitemap-0.xml --save "$RUNNER_TEMP/live-sitemap-0.xml"
      # After every check: pages opened or prefetched before this deploy keep their CSS and JS
      # for one more deploy. An unreachable live manifest is a warning only.
      - name: Keep the previous deploy's bundles
        run: node scripts/asset-manifest.mjs carry --live-url https://local.cloud/asset-manifest.json
      - name: Deploy site and analytics proxy to Cloudflare
        id: deployment
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: pnpm
          command: deploy
      - name: Verify deployed SEO routes
        run: node scripts/verify-live-seo.mjs
        env:
          SEO_VERIFY_BASE_URL: ${{ steps.deployment.outputs.deployment-url || 'https://local.cloud' }}
      # Non-blocking: tell IndexNow engines about URLs that are new or whose lastmod changed.
      - name: Submit new and changed URLs to IndexNow
        continue-on-error: true
        run: node scripts/sitemap-guard.mjs indexnow --live "$RUNNER_TEMP/live-sitemap-0.xml"

  verify-live-seo:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify custom domain SEO routes
        run: node scripts/verify-live-seo.mjs
        env:
          SEO_VERIFY_BASE_URL: ${{ vars.SEO_VERIFY_BASE_URL || 'https://local.cloud' }}
