name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployment-url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify site
        run: pnpm run build
      - name: Test installer
        run: pnpm run test:installer
      - name: Test live SEO verification
        run: pnpm run test:live-seo
      - name: Deploy static assets to Cloudflare
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: pnpm
          command: deploy
      - name: Verify deployed SEO routes
        run: node scripts/verify-live-seo.mjs
        env:
          SEO_VERIFY_BASE_URL: ${{ steps.deployment.outputs.deployment-url }}

  verify-live-seo:
    if: ${{ vars.SEO_VERIFY_BASE_URL != '' }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify custom domain SEO routes
        run: node scripts/verify-live-seo.mjs
        env:
          SEO_VERIFY_BASE_URL: ${{ vars.SEO_VERIFY_BASE_URL }}
