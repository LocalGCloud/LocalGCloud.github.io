<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LocalCloud App Icon">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="app-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a75f3" />
      <stop offset="50%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>

    <!-- Cloud body gradient -->
    <linearGradient id="cloud-body" x1="160" y1="120" x2="360" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e8f0fe" />
    </linearGradient>

    <!-- Container base gradient -->
    <linearGradient id="container-box" x1="160" y1="260" x2="352" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5fd" />
    </linearGradient>

    <!-- Ambient drop shadow for the squircle -->
    <filter id="app-shadow" x="-10%" y="-10%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#072b61" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#072b61" flood-opacity="0.22" />
    </filter>

    <!-- Inner depth shadow for container -->
    <filter id="core-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0a3875" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base App Squircle with Deep Shadow -->
  <rect x="44" y="44" width="424" height="424" rx="104" fill="url(#app-bg)" filter="url(#app-shadow)" />

  <!-- Subtle Rim Highlight -->
  <rect x="46" y="46" width="420" height="420" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" />

  <!-- Subtle Inner Container Mesh/Grid Lines (Developer Tool Aesthetic) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="128" y1="44" x2="128" y2="468" />
    <line x1="256" y1="44" x2="256" y2="468" />
    <line x1="384" y1="44" x2="384" y2="468" />
    <line x1="44" y1="128" x2="468" y2="128" />
    <line x1="44" y1="256" x2="468" y2="256" />
    <line x1="44" y1="384" x2="468" y2="384" />
  </g>

  <!-- Cloud Volume Shape (Google Cloud Inspired) -->
  <g filter="url(#core-shadow)">
    <path d="M192 316c-38.6 0-70-30-70-67 0-33.8 25.8-61.8 59-66.2 6.8-49.8 49-88.8 100-88.8 45.4 0 84.2 30.6 96.8 73.2 36.4 7.2 64.2 37.4 64.2 74.8 0 41.4-34.6 74-78 74H192Z" fill="url(#cloud-body)" />
  </g>

  <!-- Localhost Runtime Unit (The "In-A-Box" Container) -->
  <g filter="url(#core-shadow)">
    <!-- Container Shell -->
    <rect x="156" y="254" width="200" height="136" rx="28" fill="url(#container-box)" stroke="#c3d9ff" stroke-width="4" />

    <!-- Terminal Title Bar Line -->
    <line x1="156" y1="294" x2="356" y2="294" stroke="#dbe7fb" stroke-width="2.5" />

    <!-- Mini Status Window Dots -->
    <circle cx="180" cy="274" r="5" fill="#ea4335" />
    <circle cx="198" cy="274" r="5" fill="#fbbc04" />
    <circle cx="216" cy="274" r="5" fill="#34a853" />

    <!-- Local Runtime Console Prompt Symbol -->
    <path d="M184 326 l14 14 -14 14" fill="none" stroke="#1a73e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Cursor block -->
    <rect x="210" y="348" width="28" height="5" rx="2.5" fill="#1a73e8" />

    <!-- Local Port Badge / Active Status -->
    <rect x="270" y="328" width="66" height="26" rx="13" fill="#e8f5e9" stroke="#34a853" stroke-width="2" />
    <circle cx="282" cy="341" r="4" fill="#34a853" />
    <text x="293" y="345" fill="#188038" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">8080</text>
  </g>

  <!-- The 4 GCP Google Brand Accent Satellites / Service Endpoints -->
  <!-- Blue (Compute / Runtime) -->
  <g transform="translate(112, 168)">
    <circle cx="0" cy="0" r="15" fill="#1a73e8" filter="url(#core-shadow)" />
    <circle cx="0" cy="0" r="19" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Red (Storage / Data) -->
  <g transform="translate(396, 178)">
    <circle cx="0" cy="0" r="15" fill="#ea4335" filter="url(#core-shadow)" />
    <circle cx="0" cy="0" r="19" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Yellow (Identity / Security) -->
  <g transform="translate(132, 386)">
    <circle cx="0" cy="0" r="14" fill="#fbbc04" filter="url(#core-shadow)" />
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Green (Healthy Endpoint / Verified) -->
  <g transform="translate(382, 376)">
    <circle cx="0" cy="0" r="16" fill="#34a853" filter="url(#core-shadow)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.75" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
