  <circle cx="23" cy="23" r="3.5" fill="#4285f4" />
  <circle cx="73" cy="26" r="3.5" fill="#ea4335" />
  <circle cx="23" cy="71" r="3" fill="#fbbc04" />
  <circle cx="73" cy="71" r="3.5" fill="#34a853" />
