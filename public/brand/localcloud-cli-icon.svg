<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LocalCloud CLI Icon">
  <defs>
    <linearGradient id="cli-terminal-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Dark Terminal Window Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cli-terminal-bg)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Terminal Header Bar -->
  <line x1="2" y1="18" x2="62" y2="18" stroke="#334155" stroke-width="1.5" />
  <circle cx="10" cy="10" r="2.5" fill="#ea4335" />
  <circle cx="17" cy="10" r="2.5" fill="#fbbc04" />
  <circle cx="24" cy="10" r="2.5" fill="#34a853" />
  
  <!-- CLI Prompt: > -->
  <path d="M12 28l7 5.5-7 5.5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Command cursor: _ -->
  <line x1="23" y1="39" x2="33" y2="39" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />

  <!-- LocalCloud Micro-Emblem inside terminal -->
  <g transform="translate(36, 32)">
    <!-- Micro cloud -->
    <path d="M4 14c-2.5 0-4-1.8-4-4 0-2 1.5-3.6 3.5-3.9 1-3.6 4-6.1 7.5-6.1 3 0 5.6 1.8 6.5 4.5 2.2.4 3.5 2.1 3.5 4.3 0 2.4-2 4.2-4.5 4.2H4Z" fill="#1a73e8" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <!-- Center running dot -->
    <circle cx="9" cy="9.5" r="2" fill="#34a853" />
  </g>

  <!-- Output log ticker line -->
  <line x1="12" y1="48" x2="36" y2="48" stroke="#475569" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="53" x2="26" y2="53" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  <circle cx="53" cy="51" r="3" fill="#34a853" />
</svg>
