name: localcloud
image: localcloud/localcloud-mcp-server:0.1.0
title: LocalCloud MCP Server
description: Stdio MCP server for LocalCloud, the local Google Cloud emulator.
license: Apache-2.0
transport:
  type: stdio
entrypoint:
  command: node
  args:
    - dist/index.js
links:
  homepage: https://local.cloud/
  docs: https://local.cloud/docs/
  compatibility: https://local.cloud/compatibility/
  services: https://local.cloud/services/
  source: https://github.com/LocalGCloud/LocalGCloud.github.io/tree/main/packages/localcloud-mcp-server
icon: https://local.cloud/brand/localcloud-mark.svg
env:
  - name: LOCALCLOUD_MCP_ENABLE_GCP_CLIENT
    default: '0'
    description: Enable constrained gcloud execution after per-call confirmation.
  - name: LOCALCLOUD_MCP_ENABLE_STATE_RESET
    default: '0'
    description: Enable LocalCloud reset endpoint calls after per-call confirmation.
volumes:
  - name: docker-socket
    mountPath: /var/run/docker.sock
    optional: true
    description: Required only for runtime, logs, and state tools that manage host Docker.
security:
  noDefaultGcpCredentialsRequired: true
  arbitraryShellExecution: false
  destructiveActionsRequireConfirm: true
  stdoutProtocolOnly: true
