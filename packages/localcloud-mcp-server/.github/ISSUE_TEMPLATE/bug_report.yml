name: LocalCloud MCP bug report
description: Report a bug in the LocalCloud MCP server package
labels: [bug, mcp]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude
        - Cursor
        - VS Code / GitHub Copilot
        - Cline
        - Zed
        - OpenCode
        - Codex
        - Aider
        - Continue
        - Other
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the tool name, arguments with secrets removed, and stderr logs if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
