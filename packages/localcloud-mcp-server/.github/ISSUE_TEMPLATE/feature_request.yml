name: LocalCloud MCP feature request
description: Request a package, tool, prompt, or distribution metadata improvement
labels: [enhancement, mcp]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What local GCP emulator workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: Does this involve Docker, state reset, credentials, network access, or destructive actions?
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Source references
      description: Link local.cloud docs or other primary sources for factual claims.
