startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      LOCALCLOUD_MCP_ENABLE_STATE_RESET:
        type: string
        enum: ['0', '1']
        default: '0'
        description: Opt in to calling the LocalCloud reset endpoint when confirm is true.
    additionalProperties: false
  commandFunction: |
    (config) => ({
      command: 'npx',
      args: ['-y', '@localcloud/localcloud-mcp-server'],
      env: config
    })
